<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Austin Global Services | Order</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="service-details.css">

</head>


<body>


<header>

<div class="container">

<h1>
<span class="highlight">
Austin Global
</span>
Services
</h1>


<nav>

<ul>

<li>
<a href="index.html">
Home
</a>
</li>


<li>
<a href="services.html">
Services
</a>
</li>

</ul>

</nav>

</div>

</header>






<section class="product-page">


<div class="container">


<div class="product-image">


<img 
id="serviceImage"
src=""
alt="Service">


</div>






<div class="product-info">


<h1 id="serviceName">
Loading...
</h1>



<div id="rating">

</div>



<p id="description">

</p>



<h2 id="price">

</h2>




<div class="quantity-box">


<h3>
Quantity
</h3>


<button id="minus">
−
</button>


<span id="quantity">
1
</span>


<button id="plus">
+
</button>


</div>





<div class="upload-box">


<h3>
Upload Document/Image
</h3>


<input 
type="file"
id="fileUpload"
accept=".pdf,.doc,.docx,image/*"
>


</div>






<div class="notes-box">


<h3>
Special Instructions
</h3>


<textarea
id="notes"
placeholder="Write anything you want us to know..."
></textarea>


</div>






<div class="delivery-box">


<h3>
Delivery
</h3>


<p id="deliveryMessage">

</p>



<div id="locationBox"
style="display:none;">


<label>
Delivery Location
</label>


<input
type="text"
id="location"
placeholder="Enter your address"
>


</div>


</div>





<button id="orderButton">

Place Order

</button>




</div>


</div>


</section>





<footer>

<p>
© 2026 Austin Global Services
</p>

</footer>




<script src="js/service-details.js"></script>


</body>

</html>
